name: Update tenders

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tenders
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch tenders
        run: node scripts/fetch-tenders.mjs
      - name: Commit if changed
        run: |
          git add tenders.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git config user.name "bidlens-bot"
            git config user.email "bidlens-bot@users.noreply.github.com"
            git commit -m "Update tenders $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
