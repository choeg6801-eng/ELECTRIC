<!doctype html>
<html lang="ko" data-theme="b">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BidLens · 해외 전력 입찰서 분석 도구</title>
<meta name="description" content="영문 전력 변압기 입찰서(RFP)에서 핵심 규격 31개 항목을 추출해 자사 표준품과 비교하고 Bid/No-Bid 판정 · 영문 질의서 · 제출 준비 목록을 만들어 주는 도구. 세계은행 · EU 해외 전력 입찰 공고도 모아 보여줘요.">
<meta name="theme-color" content="#0B2B55">
<meta property="og:type" content="website">
<meta property="og:title" content="BidLens · 해외 전력 입찰서 분석 도구">
<meta property="og:description" content="수백 페이지 입찰서, 핵심 규격만 먼저 보세요. IEC · IEEE 기준 Bid/No-Bid 판정과 영문 질의서 초안.">
<meta property="og:image" content="photos/substation.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B2B55'/%3E%3Crect x='7' y='5' width='18' height='22' rx='4' fill='none' stroke='%23A9E4FF' stroke-width='2.4'/%3E%3Cpath d='M17.5 9l-5 8h5l-2.5 6 6-9h-5l2-5z' fill='%23A9E4FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: cinematic navy marketing site with photo-led bands; the logged-in app is a light work surface with a navy rail. Single visual world by choice: every color set explicitly. */
:root{
  --n950:#071528; --n900:#0B1F3A; --n850:#0D2341; --n800:#102A4C; --nline:#1D3A63; --nline2:#2A4C78;
  --on-dark:#EAF0F7; --on-dark-2:#C9D6E6; --on-dark-3:#A9B9CE; --on-dark-4:#8A9DB6;
  --cyan:#4CC9F0; --cyan-ink:#04182E;
  --paper:#F5F8FC; --card:#FFFFFF; --line:#E3EAF3; --line2:#CBD7E6; --ink:#0B1F3A; --ink-2:#3E5573; --ink-3:#52657E; --blue:#1E6FD9; --blue-soft:#E8F1FC;
  --ok:#146C3E; --ok-bg:#E3F6EC; --adj:#7A5200; --adj-bg:#FFF1D6; --no:#9B1C1C; --no-bg:#FDE6E6; --ask:#5B3FA0; --ask-bg:#EEE9FB; --info:#3E5573; --info-bg:#EDF2F8;
  --hl:#FFE58A;
  --f-sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gx:max(16px,env(safe-area-inset-left,0px)); --gy:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.res-ex,.row-act{display:inline-flex;gap:8px;flex-wrap:nowrap}
@media (max-width:560px){ .res-ctl{width:100%} .res-ctl #resStd{flex:1 1 100%;max-width:none!important;width:100%!important} .res-ex{flex:1 1 100%} .res-ex .btn-a{flex:1 1 0;justify-content:center} }
.ferr{color:var(--no);font-size:12.5px;line-height:1.5;margin-top:5px}
.ainput[aria-invalid="true"],.aselect[aria-invalid="true"]{border-color:var(--no)!important;box-shadow:0 0 0 2px color-mix(in srgb, var(--no) 18%, transparent)}
html,body{margin:0;padding:0}
body{background:var(--n950);color:var(--on-dark);font-family:var(--f-sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app-root :focus-visible{outline-color:var(--blue)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gx);padding-right:var(--gy)}
.dark{color-scheme:dark}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Motion */
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes scan{0%{top:0}50%{top:calc(100% - 2px)}100%{top:0}}
@keyframes loop{0%,6%{opacity:.3;transform:translateY(6px)}12%,88%{opacity:1;transform:none}96%,100%{opacity:.3}}
@keyframes glow{0%,100%{background-color:var(--hl)}50%{background-color:#FFF3C2}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes flow{0%{left:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:calc(100% - 8px);opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
.zoom{animation:zoom 16s ease-in-out infinite alternate}
.loop{animation:loop 8s ease infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.zoom,.loop,.pulse,.scanline,.track,.dot,.paper mark{animation:none!important}.loop{opacity:1}}

/* Landing */
.hero{position:relative;overflow:hidden;min-height:760px}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,21,40,.74) 0%,rgba(7,21,40,.52) 38%,rgba(7,21,40,.93) 82%,var(--n950) 100%)}
.nav{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-block:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em;text-decoration:none}
.navlinks{display:flex;flex-wrap:wrap;align-items:center;gap:22px;font-size:15px}
.navlinks a{color:var(--on-dark-3);text-decoration:none;padding:10px 0}
.navlinks a:hover{color:var(--cyan)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;font-size:15px;font-weight:600;text-decoration:none;transition:transform .15s,background-color .2s,border-color .2s}
.btn:active{transform:scale(.98)}
.btn-cyan{background:var(--cyan);color:var(--cyan-ink)}
.btn-cyan:hover{background:#6FD5F4}
.btn-ghost{background:rgba(234,240,247,.08);color:var(--on-dark);border-color:rgba(234,240,247,.3)}
.btn-ghost:hover{border-color:var(--cyan)}
.btn-lg{min-height:56px;padding:0 30px;font-size:16px}
.hero-copy{position:relative;max-width:900px;margin:0 auto;text-align:center;padding:96px 0 220px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border:1px solid rgba(76,201,240,.4);border-radius:999px;background:rgba(7,21,40,.5);font-size:14px;color:#BFEAF8}
.dotc{width:7px;height:7px;border-radius:50%;background:var(--cyan);display:inline-block}
.hero h1{font-size:clamp(36px,6.2vw,66px);line-height:1.13;letter-spacing:-.035em;font-weight:700;margin:26px 0}
.hero .lede{font-size:clamp(16px,2.2vw,19px);line-height:1.75;color:var(--on-dark-2);max-width:640px;margin:0 auto 38px}
.row-c{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:28px;font-size:14px;color:var(--on-dark-3)}

.preview{position:relative;max-width:1060px;margin:-200px auto 0}
.preview-shell{background:var(--n850);border:1px solid var(--nline);border-radius:20px;padding:14px}
.chrome{display:flex;align-items:center;gap:8px;padding:4px 8px 14px;font-size:12px;color:var(--on-dark-4);min-width:0}
.chrome i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--nline);display:inline-block}
.chrome span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-body{display:flex;flex-wrap:wrap;gap:14px}
.paper{flex:1 1 300px;min-width:0;position:relative;overflow:hidden;background:var(--paper);border-radius:12px;padding:20px 20px 14px;color:#2A3E58}
.paper .ph{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-sans);font-size:13px;font-weight:600;color:var(--ink);padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid #DCE5F0}
.paper .ph span:last-child{font-family:var(--f-mono);font-weight:500;color:#5A6B83}
.paper p.l{font-family:var(--f-mono);font-size:12px;line-height:1.75;margin-bottom:9px}
.paper p.l b{font-weight:600;color:var(--ink)}
.paper mark{background:var(--hl);color:var(--ink);padding:1px 2px;border-radius:3px;animation:glow 4.2s ease-in-out infinite}
.paper mark.w{background:#FFD9A0;animation:none}
.paper mark.q{background:#E5DCFF;animation:none}
.paper .pf{text-align:center;font-family:var(--f-mono);font-size:11px;color:#5F708A;margin-top:6px}
.scanline{position:absolute;left:0;right:0;height:2px;background:var(--cyan);box-shadow:0 0 16px 2px var(--cyan);animation:scan 5s ease-in-out infinite}
.prev-rows{flex:2 1 380px;display:flex;flex-direction:column;gap:8px;min-width:0}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;background:var(--n800);border-radius:10px;font-size:15px}
.prow span:first-child{min-width:0}
.prow em{font-style:normal;color:var(--on-dark-3)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
.tag-ok{background:rgba(123,227,168,.14);color:#7BE3A8}
.tag-adj{background:rgba(255,210,122,.14);color:#FFD27A}
.tag-ask{background:rgba(196,177,255,.16);color:#C9B8FF}
.verdict-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;border:1px solid rgba(255,210,122,.4);border-radius:10px;color:#FFD27A;font-weight:600}

.marquee{overflow:hidden;margin-top:72px;padding:6px 0}
.track{display:flex;width:max-content;gap:48px;padding-right:48px;font-family:var(--f-mono);font-size:15px;color:#9DB2CE;animation:marquee 34s linear infinite}
.track .c{color:var(--cyan)}

.sec{padding-block:110px}
@media (max-width:640px){.sec{padding-block:72px}}
.band{background:var(--n900);border-top:1px solid #142F55;border-bottom:1px solid #142F55}
.eyebrow{font-size:14px;font-weight:600;color:var(--cyan);margin-bottom:14px;letter-spacing:.02em}
.h2{font-size:clamp(28px,4vw,42px);line-height:1.3;font-weight:700;letter-spacing:-.025em}
.sub{color:var(--on-dark-3);font-size:17px;line-height:1.75;max-width:640px}
.split{display:flex;flex-wrap:wrap;gap:64px;align-items:center}
.split>*{flex:1 1 400px;min-width:0}
@media (max-width:640px){.split{gap:40px}}
.photo{position:relative;overflow:hidden;border-radius:20px;aspect-ratio:4/3;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s}
.photo:hover img{transform:scale(1.05)}
.photo .cap{position:absolute;left:16px;right:16px;bottom:16px;width:fit-content;max-width:calc(100% - 32px);padding:10px 14px;background:rgba(7,21,40,.86);border:1px solid var(--nline);border-radius:12px;font-size:14px}
.reasons{display:flex;flex-direction:column;gap:26px;margin-top:32px}
.reason{display:flex;gap:18px}
.reason .n{flex:none;width:40px;height:40px;border-radius:12px;background:var(--n800);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);color:var(--cyan)}
.reason h3{font-size:18px;font-weight:600;margin-bottom:6px}
.reason p{color:var(--on-dark-3);font-size:15px;line-height:1.7}
.center{text-align:center;margin:0 auto 56px;max-width:700px}
.center .sub{margin:16px auto 0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.fcard{border:1px solid var(--nline);border-radius:16px;padding:28px;background:var(--n850);transition:border-color .25s,transform .25s}
.fcard:hover{border-color:var(--cyan);transform:translateY(-3px)}
.fcard h3{font-size:19px;font-weight:600;margin:20px 0 10px}
.fcard p{color:var(--on-dark-3);font-size:15px;line-height:1.7}
.fcard .kbd{display:inline-block;margin-top:14px;font-family:var(--f-sans);font-size:12.5px;color:var(--on-dark-4)}
.steps-line{position:relative;height:2px;background:var(--nline);margin:0 4% 32px}
.dot{position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--cyan);animation:flow 2.6s linear infinite}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:32px}
.step{position:relative;padding-top:30px}
.step::before{content:'';position:absolute;top:4px;left:0;right:0;height:2px;background:var(--nline)}
@media (min-width:1100px){.step::before{right:-32px}.step:last-child::before{right:0}}
.step::after{content:'';position:absolute;top:0;left:0;width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(169,228,255,.16)}
.step .k{font-family:var(--f-mono);font-size:15px;color:var(--cyan);margin-bottom:12px}
.step h3{font-size:20px;font-weight:600;margin-bottom:8px}
.step p{color:var(--on-dark-3);font-size:15px;line-height:1.7}
.photoband{position:relative;overflow:hidden;min-height:440px;display:flex;align-items:center}
.photoband>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photoband .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,21,40,.93) 0%,rgba(7,21,40,.66) 55%,rgba(7,21,40,.25) 100%)}
.photoband .wrap{position:relative;width:100%;padding-block:80px}
.quote{font-size:clamp(24px,3.6vw,40px);line-height:1.38;font-weight:700;letter-spacing:-.025em;max-width:660px;margin-bottom:18px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:1px;background:var(--nline);border:1px solid var(--nline);border-radius:16px;overflow:hidden}
.fields>div{background:var(--n900);padding:26px}
.fields h3{font-size:17px;font-weight:600;margin-bottom:12px}
.fields p{color:var(--on-dark-3);font-size:15px;line-height:2}
.ucard{background:var(--n850);border:1px solid var(--nline);border-radius:18px;overflow:hidden;transition:border-color .25s,transform .25s}
.ucard:hover{border-color:var(--cyan);transform:translateY(-3px)}
.ucard .photo{border-radius:0}
.ucard .b{padding:24px}
.ucard .r{font-size:13px;font-weight:600;color:var(--cyan);margin-bottom:8px}
.ucard h3{font-size:20px;font-weight:600;margin-bottom:10px}
.ucard p{color:var(--on-dark-3);font-size:15px;line-height:1.7}
.roadmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0 24px;border-top:1px solid var(--nline)}
.roadmap>div{position:relative;padding:28px 0 20px}
.roadmap>div::before{content:"";position:absolute;top:-6px;left:0;width:11px;height:11px;border-radius:50%;border:2px solid #4C6A92;background:var(--n950)}
.roadmap>div.now::before{background:var(--cyan);border-color:var(--cyan)}
.roadmap .w{font-size:13px;color:var(--on-dark-4);margin:8px 0 10px}
.roadmap .now .w{color:var(--cyan);font-weight:600}
.roadmap h3{font-size:18px;font-weight:600;margin-bottom:8px}
.roadmap p{color:var(--on-dark-3);font-size:14px;line-height:1.7}
.faq{max-width:820px;margin:0 auto}
.faq details{border-bottom:1px solid var(--nline)}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:68px;padding:18px 0;font-size:18px;font-weight:500;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--nline2);display:flex;align-items:center;justify-content:center;color:var(--cyan);font-size:18px}
.faq details[open] summary::after{content:"−"}
.faq details p{color:var(--on-dark-3);font-size:16px;line-height:1.8;padding:0 0 24px}
.cta{position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--nline)}
.cta>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cta .scrim{position:absolute;inset:0;background:rgba(7,21,40,.84)}
.cta .in{position:relative;padding:72px 24px;text-align:center}
.cta .in p{color:var(--on-dark-2);font-size:17px;margin:14px 0 32px}
.foot{border-top:1px solid #142F55}
.foot .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:32px;padding-block:48px}
.foot .cols{display:flex;flex-wrap:wrap;gap:56px;font-size:14px}
.foot .cols div{display:flex;flex-direction:column;gap:2px}
.foot .cols span{color:var(--on-dark);font-weight:600}
.foot .cols a{color:var(--on-dark-3);text-decoration:none;padding:7px 0}
.foot .cols a:hover{color:var(--cyan)}
.foot .bot{padding-block:20px 36px;border-top:1px solid #142F55;font-size:13px;color:var(--on-dark-4);line-height:1.7}

/* Login */
.login{position:relative;overflow:hidden;min-height:100vh}
.login>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.login .scrim{position:absolute;inset:0;background:rgba(7,21,40,.8)}
.login .in{position:relative;display:flex;justify-content:center;padding-block:56px}
.login-card{width:100%;max-width:440px;background:rgba(11,31,58,.95);border:1px solid var(--nline2);border-radius:20px;padding:32px}
@media (max-width:480px){.login-card{padding:24px}}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.field label{font-size:14px;color:var(--on-dark-2)}
.dinput{height:50px;padding:0 16px;background:var(--n950);border:1px solid var(--nline2);border-radius:12px;color:var(--on-dark);font-size:15px;width:100%}
.dinput:focus{border-color:var(--cyan);outline:none}
.err{font-size:13px;color:#FF9A9A;min-height:18px}
.muted-d{color:var(--on-dark-3);font-size:14px}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--on-dark-4);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--nline)}
.notice-d{margin-top:18px;padding:12px 14px;border:1px solid var(--nline);border-radius:12px;font-size:13px;color:var(--on-dark-3);line-height:1.6;background:rgba(7,21,40,.5)}

/* App */
.app-root{background:var(--paper);color:var(--ink);min-height:100vh;color-scheme:light}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
.rail{flex:1 1 236px;max-width:100%;background:var(--n950);color:var(--on-dark);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.rail .brand{padding:0 8px 18px;font-size:18px}
.rail .new{width:100%;min-height:46px;border-radius:10px;border:none;background:var(--cyan);color:var(--cyan-ink);font-weight:600;font-size:15px;margin-bottom:14px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:0 12px;border:none;border-radius:8px;background:transparent;color:var(--on-dark-3);font-size:15px;text-align:left}
.rail nav button:hover{color:var(--on-dark);background:rgba(255,255,255,.04)}
.rail nav button[aria-current="page"]{background:var(--n800);color:var(--on-dark);font-weight:600}
.rail nav .cnt{font-family:var(--f-mono);font-size:12px;color:var(--on-dark-4)}
.rail .lbl{margin:22px 12px 8px;font-size:12px;font-weight:600;color:var(--on-dark-4);letter-spacing:.04em}
.rail .up{margin:0 4px;padding:12px 14px;background:var(--n900);border-radius:10px;font-size:13px;line-height:1.9}
.rail .up button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--on-dark-2);font-size:13px;padding:2px 0;min-height:30px}
.rail .up button:hover{color:var(--cyan)}
.rail .user{margin-top:auto;padding:16px 8px 0;border-top:1px solid var(--nline);display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--on-dark-3)}
.rail .user b{color:var(--on-dark);font-weight:600;font-size:14px}
.rail .user .row{display:flex;flex-wrap:wrap;gap:14px}
.rail .user button{min-height:40px;padding:0;background:none;border:none;color:var(--on-dark-3);font-size:14px}
.rail .user button:hover{color:var(--cyan)}

function go(screen){
  S.screen = screen; var th = $('#themer'); if(th) th.hidden = true;
  if(screen !== 'app'){ try { sessionStorage.removeItem('bl.inapp'); } catch(e){} }
  if(screen === 'intro') renderIntro();

  else {
    if(!session){ S.screen = 'login'; renderLogin(); return; }
    if(!analyses.length){ seedSample(); saveAll(); }
    if(!S.enteredApp){ S.enteredApp = true; if(S.view === 'new') loadNav(localStorage); }
    if(!current() && analyses[0]) S.currentId = analyses[0].id;

  }
}

function upcoming(){

    ['clarDeadline','bidDeadline'].forEach(function(k){ var f = a.fields[k]; if(!f) return; var key = shortName(a) + '|' + k + '|' + f.v.date; if(seen[key]) return; seen[key] = 1; list.push({ a: a, k: k, n: BL.dday(f.v.date), date: f.v.date }); });
  });
  var analyzed = {}; analyses.forEach(function(a){ if(a.liveId) analyzed[a.liveId] = 1; });
  watched.forEach(function(w){ if(!analyzed[w.id]) list.push({ w: w, k: 'watch', n: BL.dday(w.deadline), date: w.deadline }); });
  return list.sort(function(x, y){ var ax = x.n < 0 ? 100000 - x.n : x.n, ay = y.n < 0 ? 100000 - y.n : y.n; return ax - ay; });
}

function pickStd(fields){
  var v = fields.voltage && fields.voltage.v, c = fields.capacity && fields.capacity.v, ins = fields.insulation && fields.insulation.v, fq = fields.frequency && fields.frequency.v;
  if(!v && !c) return settings.defaultStd;
  if(!ins && fields.cooling){ var cc = fields.cooling.v.codes || []; if(cc.some(function(x){ return /^(?:ON|OF|OD|KN|KF)/.test(x); })) ins = { type: 'oil' }; else if(cc.length && cc.every(function(x){ return /^A[NF]$/.test(x); })) ins = { type: 'dry' }; }
  var best = null, bs = -1e9;
  stds.forEach(function(s){
    var sc = 0;
    if(v){ sc += v.hv === s.hv ? 4 : -Math.min(4, Math.abs(v.hv - s.hv) / 40); if(v.lv != null && v.lv === s.lv) sc += 1; }
    if(c){ sc += 2 - Math.min(3, Math.abs(c.mva - s.mva) / s.mva * 4); }
    if(ins) sc += ins.type === (s.insulation === 'dry' ? 'dry' : 'oil') ? 3 : -3;
    if(fq && (s.freq === 'both' || +s.freq === fq.hz)) sc += 0.5;

  return best ? best.id : settings.defaultStd;
}

async function readPdf(file, startN, onPage){
  var buf = await file.arrayBuffer();

  var pages = [];

    var pg = await doc.getPage(i);
    var tc = await pg.getTextContent();
    var txt = '', lastY = null;
    tc.items.forEach(function(it){
      var y = it.transform ? Math.round(it.transform[5]) : null;
      if(lastY != null && y != null && Math.abs(y - lastY) > 2 && !/\n$/.test(txt)) txt += '\n';
      txt += it.str; txt += it.hasEOL ? '\n' : (it.str && !/\s$/.test(it.str) ? ' ' : '');

    });
    var po = { n: startN + i - 1, text: BL.normPage(txt), doc: file.name, dp: i };
    Object.defineProperty(po, '_src', { value: { pdf: doc, n: i }, enumerable: false });
    pages.push(po);

}
function splitText(t, startN, docName){

  else if(/\f/.test(t)) parts = t.split(/\f/);
  else if(/\n\s*\n\s*\n/.test(t)) parts = t.split(/\n\s*\n\s*\n/);
  else { parts = []; for(var i = 0; i < t.length; i += 3000) parts.push(t.slice(i, i + 3000)); }
  return parts.map(function(x){ return x.trim(); }).filter(Boolean).map(function(x, i){ return { n: startN + i, text: BL.normPage(x), doc: docName, dp: i + 1 }; });
}
function pickForAi(pages, limit){
  var kw = /kV|MVA|cooling|impulse|impedance|type test|ISO|agent|deliver|liquidated|payment|warranty|price adjustment|deadline|clarification|security|quoted|Employer|experience|similar|capitali/gi;
  var total = pages.reduce(function(s, p){ return s + p.text.length + 14; }, 0);
  if(total <= limit) return pages;
  var scored = pages.map(function(p){ return { p: p, s: (p.text.match(kw) || []).length }; }).sort(function(a, b){ return b.s - a.s; });
  var out = [], used = 0;
  for(var i = 0; i < scored.length; i++){ var L = scored[i].p.text.length + 14; if(used + L > limit) continue; out.push(scored[i].p); used += L; }
  return out.sort(function(a, b){ return a.n - b.n; });
}

async function aiFill(pages, fields){

  var chosen = pickForAi(pages, 48000);
  var body = chosen.map(function(p){ return '[[PAGE ' + p.n + ']]\n' + p.text; }).join('\n');
  var keys = missing.map(function(f){ return '- ' + f.k + ': ' + f.en; }).join('\n');
  var prompt = 'You read an English tender document (RFP) for power transformers and find specific requirements.\n' +
    'Pages are marked [[PAGE n]]. Find ONLY these items:\n' + keys + '\n\n' +
    'Reply with only a JSON object of the form {"items":[{"key":"<key>","page":<page number>,"quote":"<one sentence copied exactly from that page>"}]}. ' +
    'The quote must be copied word for word from the document and must contain the value. Leave out any item you cannot find. Do not guess.\n\nDOCUMENT:\n' + body;
  S.ctl = new AbortController();
  var res = await S.ai.json(prompt, { signal: S.ctl.signal });
  var items = res && Array.isArray(res.items) ? res.items : [];

  $('#themer').innerHTML = (themeOpen ? '<div class="menu" role="radiogroup" aria-label="디자인 시안"><p>블루프린트 네이비 시안 5종 · 기능은 모두 같아요</p>' + THEMES.map(function(x){ return '<button type="button" role="radio" aria-checked="' + (x.k === cur) + '" data-theme-pick="' + x.k + '"><span class="sw" style="background:' + x.sw + '"></span><span>' + x.n + '<small>' + x.d + '</small></span></button>'; }).join('') + '</div>' : '') +
    '<button type="button" class="tbtn" data-theme-toggle aria-expanded="' + themeOpen + '" aria-label="디자인 시안 바꾸기 (현재 시안 ' + cur.toUpperCase() + ')"><i>' + cur.toUpperCase() + '</i>시안 바꾸기</button>';
}
document.addEventListener('click', function(e){
  var p = e.target.closest('[data-theme-pick]'); if(p){ themeOpen = false; setTheme(p.dataset.themePick); if(S.screen === 'app' && S.view === 'settings') renderMain(); toast(THEMES.filter(function(x){ return x.k === p.dataset.themePick; })[0].n + '로 바꿨어요'); return; }
  if(e.target.closest('[data-theme-toggle]')){ themeOpen = !themeOpen; renderThemer(); return; }
  if(themeOpen && !e.target.closest('#themer')){ themeOpen = false; renderThemer(); }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && themeOpen){ themeOpen = false; renderThemer(); }
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('a[data-theme-toggle]')){ e.preventDefault(); themeOpen = !themeOpen; renderThemer(); }
  if(e.key === 'Escape' && S.screen === 'app' && (S.renaming || S.editKey)){ S.renaming = false; S.editKey = null; S.editErr = ''; renderMain(); }
  var tb = e.target.closest && e.target.closest('[role="tab"]');
  if(tb && /^(?:ArrowRight|ArrowLeft|Home|End)$/.test(e.key)){ e.preventDefault(); var all = $$('[role="tab"]'), i = all.indexOf(tb), nx = e.key === 'Home' ? all[0] : e.key === 'End' ? all[all.length - 1] : all[(i + (e.key === 'ArrowRight' ? 1 : all.length - 1)) % all.length]; if(nx){ S.tab = nx.dataset.tab; renderMain(); var f = $('[role="tab"][data-tab="' + S.tab + '"]'); if(f) f.focus(); } }
});
(function(){ document.documentElement.dataset.theme = 'b'; var th = $('#themer'); if(th){ th.hidden = true; th.innerHTML = ''; } })();

/* ---------------- Boot ---------------- */
(function(){ var inApp = false; try { inApp = !!session && sessionStorage.getItem('bl.inapp') === '1'; } catch(e){} if(inApp){ S.enteredApp = true; loadNav(sessionStorage); go('app'); } else go('intro'); })();
if(window.claude && typeof window.claude.use === 'function'){
  window.claude.use('sample').then(function(s){
    S.ai = s || null;
    if(S.ai && typeof S.ai.limits === 'function') S.ai.limits().then(function(l){ S.imgOk = !!(l && l.images); S.imgMax = l && l.images ? l.images.maxCount : 0; if(S.screen === 'app') renderMain(); }, function(){});
    if(S.screen === 'app') renderMain();
  }, function(){});
  window.claude.use('downloads').then(function(d){ S.downloads = d || null; }, function(){});
}
})();
